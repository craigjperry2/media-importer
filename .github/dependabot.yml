version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Updates the nixpkgs input in flake.lock, which pins the dev shell and CI
  # toolchain (rustc, clippy, rustfmt, prek).
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # Minor and patch updates share one pull request. Major updates arrive
  # separately because they may need code changes.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      cargo:
        update-types: [minor, patch]
