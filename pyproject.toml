[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "media_importer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
media-importer = "media_importer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
    "mypy",
    "prek",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
